name: "CI — Build & Test"

# Working Go CI — generated by LaneSync.
# Runs go test with coverage, renders HTML reports, and uploads evidence to LaneSync.
# Large monorepos (e.g. k8s.io/kubernetes): set GO_TEST_PACKAGES repo variable, or rely on
# auto-detection which scopes to ./pkg/apis/... with -short.

on:
  pull_request:
    branches: [ "main", "release-*" ]
  push:
    branches: [ "main", "release-*" ]

env:
  GO_TEST_PACKAGES: ${{ vars.GO_TEST_PACKAGES }}

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          go-version: '1.22'

      - name: Run unit tests
        run: |
          if [ -f go.mod ] && find . -name '*_test.go' -not -path './vendor/*' -print -quit | grep -q .; then
            if [ -n "$GO_TEST_PACKAGES" ]; then
              PACKAGES="$GO_TEST_PACKAGES"
            elif grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              PACKAGES="./pkg/apis/..."
            else
              PACKAGES="./..."
            fi

            if grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              TEST_FLAGS="-short -count=1"
              export PATH="$(go env GOPATH)/bin:$PATH"
              go install gotest.tools/gotestsum@latest >/dev/null 2>&1 || true
              if command -v gotestsum >/dev/null 2>&1; then
                gotestsum --format standard-verbose -- -coverprofile=coverage.out $TEST_FLAGS $PACKAGES > test-output.txt 2>&1 || TEST_EXIT=$?
              else
                go test -v -coverprofile=coverage.out $TEST_FLAGS $PACKAGES > test-output.txt 2>&1 || TEST_EXIT=$?
              fi
            else
              go test -v -coverprofile=coverage.out $PACKAGES > test-output.txt 2>&1 || TEST_EXIT=$?
            fi
            go tool cover -html=coverage.out -o coverage_tmp.html 2>/dev/null || true
          else
            echo "No Go tests found — skipping. Add *_test.go files to get started." > test-output.txt
          fi
          mkdir -p coverage
          [ -f coverage_tmp.html ] && mv coverage_tmp.html coverage/index.html || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Unit Tests</h1><pre>$(cat test-output.txt 2>/dev/null | head -200 || echo 'No tests yet.')</pre></body></html>" > unit-tests.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      - name: Dependency audit (CVE)
        if: always()
        run: |
          if [ -f go.mod ]; then
            if [ -n "$GO_TEST_PACKAGES" ]; then
              VULN_SCOPE="$GO_TEST_PACKAGES"
            elif grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              VULN_SCOPE="./pkg/apis/..."
            else
              VULN_SCOPE="./..."
            fi
            go install golang.org/x/vuln/cmd/govulncheck@latest >/dev/null 2>&1 || true
            echo "<html><body><h1>CVE / govulncheck</h1><pre>$($(go env GOPATH)/bin/govulncheck $VULN_SCOPE 2>/dev/null | head -50 || echo 'no audit output')</pre></body></html>" > cve-scan.html
          else
            echo "<html><body><h1>CVE / govulncheck</h1><p>Add a go.mod to enable vulnerability scanning.</p></body></html>" > cve-scan.html
          fi
          echo "<html><body><h1>SAST Scan</h1><p>Enable GitHub code scanning for full SARIF.</p></body></html>" > sast-scan-report.html

      - name: Build evidence metrics
        if: always()
        run: |
          cat > sdlc-evidence.json <<EOF
          {
            "unit_tests":        { "total": 0, "passed": 0, "failed": 0 },
            "integration_tests": { "total": 0, "passed": 0, "failed": 0 },
            "coverage":          { "line_percent": 0 },
            "sast_scan":            { "vulnerabilities": { "critical": 0, "high": 0, "medium": 0 }, "scanned_files": 0 },
            "security":          { "tool": "govulncheck", "vulnerabilities": { "critical": 0, "high": 0, "medium": 0 } }
          }
          EOF

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            sdlc-evidence.json
            unit-tests.html
            integration-tests.html
            coverage/
            sast-scan-report.html
            cve-scan.html
          retention-days: 30

      - name: Upload evidence to LaneSync
        if: ${{ always() && startsWith(github.ref, 'refs/heads/release-') }}
        env:
          SDLC_API_URL: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
        run: |
          VERSION="${GITHUB_REF#refs/heads/release-}"
          PAYLOAD=$(jq -n \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --arg version "$VERSION" \
            --argjson metrics "$(cat sdlc-evidence.json)" \
            --rawfile unit_html unit-tests.html \
            --rawfile integration_html integration-tests.html \
            --rawfile coverage_html coverage/index.html \
            --rawfile sast_html sast-scan-report.html \
            --rawfile cve_html cve-scan.html \
            '{ org: $org, repo: $repo, version: $version, pipeline: "CI — Build & Test", metrics: $metrics,
               reports: { unit_tests: $unit_html, integration_tests: $integration_html, coverage: $coverage_html, sast_scan: $sast_html, security: $cve_html } }')
          curl -s -X POST "$SDLC_API_URL/api/evidence/upload" -H "Content-Type: application/json" -d "$PAYLOAD" || echo "Evidence upload failed (non-blocking)."

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      HAS_APP_TOKEN: ${{ secrets.SDLC_APP_PRIVATE_KEY != '' && secrets.SDLC_APP_ID != '' }}
    steps:
      - name: Generate App Token
        id: generate-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Checkout Code
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Generate and Push Tag
        if: env.HAS_APP_TOKEN == 'true'
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release-* ]]; then
            VERSION=${BRANCH_NAME#release-}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Pushed tag: $NEW_TAG"
